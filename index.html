<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gate Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a codex — sticky tab bar, a working list on the left, the open page in a side drawer (full screen on phones). */
:root{
  --bg:#eceff2; --surface:#fbfcfd; --sunk:#e2e6eb; --ink:#1c2230; --muted:#5d6676; --line:#d3d8e0;
  --accent:#8a561c; --accent-soft:#f2e6d6; --accent-ink:#ffffff;
  --official:#345f9e; --project:#2c7a57; --proposal:#a86d12; --discarded:#7b8494; --danger:#a33a3a;
  --f-display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#191e28; --sunk:#232937; --ink:#e5e8ee; --muted:#9aa3b3; --line:#2c3341;
  --accent:#d4a259; --accent-soft:#2f2717; --accent-ink:#1b1408;
  --official:#7fa6e0; --project:#6cc49a; --proposal:#e0a84c; --discarded:#8e97a7; --danger:#e07a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191e28; --sunk:#232937; --ink:#e5e8ee; --muted:#9aa3b3; --line:#2c3341;
  --accent:#d4a259; --accent-soft:#2f2717; --accent-ink:#1b1408;
  --official:#7fa6e0; --project:#6cc49a; --proposal:#e0a84c; --discarded:#8e97a7; --danger:#e07a7a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-size:1.5rem;font-weight:700;letter-spacing:.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;font-weight:400}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{padding:6px 9px;white-space:nowrap;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:2px 8px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
main{padding-block:20px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.layout.open{grid-template-columns:minmax(0,1fr) minmax(0,460px)}
@media (max-width:900px){.layout.open{grid-template-columns:minmax(0,1fr)}}
h2.view{font-family:var(--f-display);font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:65ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;width:100%}
.bar select{width:auto}
textarea{min-height:76px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.82rem;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.type{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.status{border-color:currentColor;font-weight:500}
.s-official{color:var(--official)}.s-project{color:var(--project)}.s-proposal{color:var(--proposal)}.s-discarded{color:var(--discarded)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.row:hover,.row[aria-selected="true"]{background:var(--sunk)}
.row .name{font-weight:700;min-width:0}
.row .sum{grid-column:1/-1;color:var(--muted);font-size:.93rem;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.2rem;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:1.1rem;cursor:pointer}
.card h3:hover{color:var(--accent)}
.clockrow{display:flex;gap:12px;align-items:center}
.clocktxt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem}
.clocktxt small{display:block;color:var(--muted);font-size:.72rem;font-family:var(--f-body)}
.portents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.portents li{display:flex;gap:8px;align-items:flex-start}
.portents li.done span{color:var(--muted);text-decoration:line-through}
.portents .grim{color:var(--danger);font-weight:500}
aside.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto;min-width:0}
@media (max-width:900px){aside.drawer{position:fixed;inset:0;max-height:none;border-radius:0;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead h2{font-family:var(--f-display);font-size:1.5rem;margin:0;line-height:1.15;text-wrap:balance}
.dhead .fr{color:var(--muted);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.sec{margin-top:14px}
.sec h4{margin:0 0 2px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sec p{margin:0;white-space:pre-wrap}
.secret{background:var(--sunk);border-radius:var(--r);padding:8px 10px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links button.chip{cursor:pointer;color:var(--ink)}
.links button.chip:hover{border-color:var(--accent)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-weight:500;font-size:.93rem}
.form label .hint{font-weight:400;color:var(--muted);font-size:.84rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:8px}
.timeline li{position:relative;padding:0 0 18px 22px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .yr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:500}
.timeline button{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left}
.timeline button:hover{color:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:130px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
h3.sub{font-family:var(--f-display);font-size:1.25rem;margin:26px 0 8px}
.turn{display:flex;flex-direction:column;gap:10px}
.turnrow{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:4px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:var(--r);padding:3px;cursor:pointer;font-size:.88rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--r);z-index:30;font-size:.93rem}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:14px;font-size:.93rem}
.help{font-size:.9rem;color:var(--muted);max-width:65ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.login h1{font-family:var(--f-display);margin:0 0 6px;font-size:1.9rem}
.who{font-size:.85rem;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hcard h3{margin:0;font-family:var(--f-display);font-size:1.3rem}
.hcard h3 a{color:var(--ink);text-decoration:none}
.hcard h3 a:hover{color:var(--accent)}
.hcard p{margin:0}
.hcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:.93rem;display:flex;flex-direction:column;gap:4px;flex:1}
.hcard .btn{align-self:flex-start;text-decoration:none;color:var(--ink)}
.attention{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;max-width:720px}
.attention ul{margin:4px 0 0;padding-left:18px}
.attention a{color:var(--ink)}
.mapvp{position:relative;height:min(70vh,720px);overflow:hidden;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:flex}
.mapvp.dragging{cursor:grabbing}.mapvp.placing{cursor:crosshair}
.mapinner{position:absolute;left:0;top:0;transform-origin:0 0}
.mapinner img{display:block;max-width:none;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;width:0;height:0;padding:0;border:0;background:none;transform:scale(var(--inv,1));transform-origin:0 0;cursor:pointer}
.pindot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--pc);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.sel .pindot{outline:3px solid var(--ink);outline-offset:1px}
.pinlabel{position:absolute;left:13px;top:-11px;white-space:nowrap;background:var(--surface);color:var(--ink);font-size:12px;line-height:1.5;padding:0 6px;border-radius:4px;border:1px solid var(--line);pointer-events:none}
.pin:hover .pinlabel,.pin.sel .pinlabel{border-color:var(--pc);font-weight:700}
.mapvp.nolabels .pinlabel{display:none}
.mapvp.nolabels .pin:hover .pinlabel,.mapvp.nolabels .pin.sel .pinlabel{display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span:not(.sr){display:block;width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.swatches input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.swatches input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;margin-bottom:16px}
.explain summary{cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:1.1rem}
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px;margin-top:10px}
.explain-grid h4{margin:0 0 2px;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.explain-grid p{margin:0 0 6px}
.votebox{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:var(--r);padding:8px 10px;margin-top:4px}
.votebox.compact{background:transparent;padding:4px 0 0}
.votecount{font-size:.93rem}
.voters{display:flex;gap:6px;flex-wrap:wrap}
.voter{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--surface)}
.voter.approve{color:var(--project);border-color:var(--project)}
.voter.reject{color:var(--danger);border-color:var(--danger)}
.voter.none{color:var(--muted)}
.votebtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn.voted-yes{background:var(--project);border-color:var(--project);color:var(--surface)}
.btn.voted-no{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.rels{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:4px 0 0;align-items:start}
.rels dt{font-size:.85rem;color:var(--muted);padding-top:2px}.rels dd{margin:0;display:flex;gap:6px;flex-wrap:wrap}
.relset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:10px}
.relset legend{font-weight:500;font-size:.93rem;padding:0 4px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent)}
.castcard .actions{margin-top:auto}
@media (max-width:1400px){.who{display:none}}
.mmwrap{position:relative;height:min(72vh,760px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;cursor:grab;display:flex}
.mmwrap.dragging{cursor:grabbing}
.mmwrap svg{display:block;user-select:none;-webkit-user-select:none}
.mmtools{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.mmnode{cursor:pointer}
.mmnode:focus{outline:none}.mmnode:focus-visible rect:first-child{stroke:var(--ink)}
.mmtitle{font:700 14px var(--f-body);fill:var(--ink)}
.mmsub{font:12px var(--f-mono);fill:var(--muted)}
.mmlabel{font:12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.mmrel{font:italic 12px var(--f-body);fill:var(--accent);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.seg2{display:inline-flex;gap:2px}
.s-failed{color:var(--danger)}
.qboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.qcol{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qcol h3{margin:0 0 2px;font-family:var(--f-display);font-size:1.1rem}
.qcard{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-width:0;width:100%}
.qcard:hover{border-color:var(--accent)}
.qname{font-weight:700}
.qpitch{font-size:.93rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.outcome{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 12px;margin:10px 0;display:flex;flex-direction:column;gap:4px}
.sessions{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.sessions li{border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.sessform{background:var(--sunk);border-radius:var(--r);padding:10px;margin-top:6px}
.mmq{font:600 12px var(--f-body);fill:var(--ink)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;flex-wrap:wrap}
.subtabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.subtabs a:hover{color:var(--ink)}
.subtabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs .count{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);border-radius:999px;padding:0 7px}
.subtabs .count.alert{background:var(--accent-soft);color:var(--ink)}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.maplegend i,.dotsm{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lore{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;max-width:820px}
.lore li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.lore li{grid-template-columns:1fr;gap:2px}}
.lore-when{font-family:var(--f-mono);color:var(--accent);font-size:.85rem;padding-top:4px}
.lore h4{margin:0 0 4px;font-family:var(--f-display);font-size:1.2rem}
.lore p{margin:0 0 6px;max-width:65ch}
.steps{max-width:65ch;padding-left:22px;display:flex;flex-direction:column;gap:6px;margin:0}
</style>
</head>
<body>
<div id="loginScreen" class="wrap" hidden>
  <form class="login form" id="loginForm">
    <h1>The Gate Bible</h1>
    <p class="help" style="margin:0" id="loginIntro">The team's worldbuilding codex. Only people on the team list can sign in.</p>
    <label>Email<input type="email" id="loginEmail" required autocomplete="email"></label>
    <label>Password<input type="password" id="loginPassword" required minlength="8" autocomplete="current-password"></label>
    <div id="firstTimeFields" hidden class="form">
      <label>Repeat the password<input type="password" id="loginPassword2" minlength="8" autocomplete="new-password"></label>
      <label>Invite code <span class="hint">The 8-character code the teammate who added you sent you</span><input type="text" id="loginCode" autocomplete="off" style="text-transform:uppercase;font-family:var(--f-mono)"></label>
    </div>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <button class="btn ghost" type="button" id="modeBtn">First time here? Create your password</button>
    <p class="note" id="loginMsg" aria-live="polite"></p>
  </form>
</div>
<div id="app" hidden>

<header>

function clockSVG(filled,size,px=56){
  size=Math.max(1,size|0);filled=Math.max(0,Math.min(size,filled|0));
  const r=px/2-3,c=px/2;let p="";
  for(let i=0;i<size;i++){
    const a0=(i/size)*2*Math.PI-Math.PI/2,a1=((i+1)/size)*2*Math.PI-Math.PI/2;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    p+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${i<filled?"var(--accent)":"var(--sunk)"}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" role="img" aria-label="${filled} of ${size} slices filled">${p}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1"/></svg>`;
}

}
function viewCodex(){

  else body=`<div class="list" role="listbox" aria-label="Entries">`+list.map(e=>`<button class="row" role="option" data-open-entry="${e.id}" aria-selected="${S.sel&&S.sel.id===e.id}">

  return `<h2 class="view">Codex</h2><p class="lede">Every place, faction, character, god, event, item, people and loose idea, one entry each. Link entries together so you can follow how they connect.</p>

    <select id="fModule" aria-label="Filter by module">${opts(MODULES.map((m,i)=>({v:i+1,l:`${i+1}. ${m}`})),S.fModule,"All modules")}</select>

  <p class="note">${list.length} of ${S.entries.size} entries</p>${body}`;

function viewPlots(){
  const plots=[...S.plots.values()].filter(plotFilter).sort((a,b)=>(PLOT_STATES.indexOf(a.state)-PLOT_STATES.indexOf(b.state))||byName(a,b));

  const origins=[...new Set([...S.plots.values()].map(p=>p.origin||"New"))].sort();
  return `<h2 class="view">Plots &amp; quests</h2>${plotsSubnav()}<p class="lede">Each plot has a clock: a progress bar split into 4, 6 or 8 slices. When it fills, the plot succeeds and the world changes.</p>
  <details class="explain" ${S.plotHelpClosed?"":"open"} id="plotHelp"><summary>How plots work</summary>
    <div class="explain-grid">
      <div><h4>Front</h4><p>A <b>threat that grows</b> if nobody stops it: a monster, a curse, an invasion, a cult. It has <b>portents</b>, warning signs that come true one by one, and a <b>worst outcome</b> if the clock fills.</p><p class="note">Example: Cazador's freed spawn organize in the Underdark. Portents: disappearances at the docks, a district goes silent… Worst outcome: a vampire court raids the city.</p></div>
      <div><h4>Faction project</h4><p>Something a <b>faction is working toward</b>, good or bad. It is not necessarily a threat: it is simply that group's ambition, and it succeeds when the clock fills.</p><p class="note">Example: the Guild wants to control the Lower City; the Flaming Fist wants to restore order.</p></div>
      <div><h4>Subplot</h4><p>A <b>smaller or personal storyline</b> to keep track of: a mystery, a feud, a romance, a quest. Its clock shows how far along it is.</p><p class="note">Example: a merchant searching for a lost relic; two noble families on the edge of a duel.</p></div>
      <div><h4>Faction turn</h4><p>Use it <b>between two chapters or roleplay sessions</b>. It lists every active plot so you can decide, for each one, what happened while the story looked elsewhere: <b>+1</b> or <b>+2</b> if it progressed, <b>0</b> if nothing changed, <b>−1</b> if it suffered a setback. Add a one-line note, then apply: all clocks move at once and the notes go into each plot's history.</p><p class="note">This is what keeps the world alive: villains and factions keep acting even when the players are busy with something else.</p></div>
    </div>
  </details>
  <div class="bar"><div class="seg2" role="group" aria-label="Display"><button class="btn small${S.plotMode!=="mind"?" primary":""}" data-plotmode="cards" aria-pressed="${S.plotMode!=="mind"}">Cards</button><button class="btn small${S.plotMode==="mind"?" primary":""}" data-plotmode="mind" aria-pressed="${S.plotMode==="mind"}">Mind map</button></div>
  <select id="pState" aria-label="Filter by state"><option value="open" ${S.pState==="open"?"selected":""}>Active and ideas</option><option value="resolved" ${S.pState==="resolved"?"selected":""}>Resolved</option><option value="all" ${S.pState==="all"?"selected":""}>All plots</option></select>
  <select id="pKind" aria-label="Filter by kind"><option value="">All kinds</option>${PLOT_KINDS.map(k=>`<option ${S.pKind===k?"selected":""}>${k}</option>`).join("")}</select>

  ${S.plotMode==="mind"?`<label class="note" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="mmEntries" ${S.mmEntries?"checked":""}> Factions, characters &amp; places</label><label class="note" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="mmQuests" ${S.mmQuests?"checked":""}> Quests</label>`:""}
  ${S.canWrite?`<button class="btn" id="factionTurn" title="Between chapters: move every active plot's clock at once">Faction turn</button><button class="btn primary" id="newPlot">New plot</button>`:""}</div>${body}`;
}
function plotCard(p){
  const port=(p.portents||[]);
  return `<article class="card">
    <div class="chips" style="margin:0"><span class="chip type">${esc(p.kind)}</span><span class="chip">${esc(p.state||"Active")}</span>${p.origin&&p.origin!=="New"?`<span class="chip">${esc(p.origin)}</span>`:""}</div>
    <h3 data-open-plot="${p.id}" tabindex="0">${esc(p.name||"Untitled plot")}</h3>
    <div class="clockrow">${clockSVG(p.clockFilled,p.clockSize)}
      <div class="clocktxt">${p.clockFilled|0} / ${p.clockSize|0}<small>${(p.clockFilled|0)>=(p.clockSize|0)?"Clock full: it happened":"slices filled"}</small></div>
      ${S.canWrite?`<div style="margin-left:auto;display:flex;gap:4px"><button class="btn small" data-tick="${p.id}" data-d="-1" aria-label="Erase one slice">−</button><button class="btn small" data-tick="${p.id}" data-d="1" aria-label="Fill one slice">+</button></div>`:""}</div>
    ${p.goal?`<p class="note" style="margin:0"><b>Goal:</b> ${esc(p.goal)}</p>`:""}
    ${port.length||p.grim?`<ul class="portents">${port.map((x,i)=>`<li class="${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} ${S.canWrite?"":"disabled"} data-portent="${p.id}" data-i="${i}" aria-label="Portent ${i+1} has happened"><span>${esc(x.text)}</span></li>`).join("")}${p.grim?`<li><span class="grim">If nobody stops it: ${esc(p.grim)}</span></li>`:""}</ul>`:""}
    ${(p.entries||[]).length?`<div class="links">${p.entries.map(id=>`<button class="chip" data-open-entry="${id}">${esc(entryName(id))}</button>`).join("")}</div>`:""}
  </article>`;
}
function yearText(e){if(e.yearLabel)return e.yearLabel;return e.year!=null&&e.year!==""?e.year+" DR":"Year unknown"}
function viewTimeline(){
  const ev=[...S.entries.values()].filter(e=>e.type==="Event").sort((a,b)=>(a.year??1e9)-(b.year??1e9)||((a.order??0)-(b.order??0))||byName(a,b));
  const body=!ev.length?`<div class="empty"><b>No events yet</b>Create an entry of type “Event” with a year in DR and it appears here, in order.</div>`

  return `<h2 class="view">Timeline</h2><p class="lede">Every Event entry, in year order. BG3 ends in 1492 DR; your story starts wherever the team decides.</p>

}
function viewCanon(){
  const all=[...S.entries.values()];
  const count=s=>all.filter(e=>e.status===s).length;
  const props=all.filter(e=>e.status==="Proposal").sort(byName);
  const reg=[...S.register.values()].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<h2 class="view">Canon</h2><p class="lede">Every new idea starts as a Proposal, and the team votes on it. Each member has one equal vote. Decisions are unanimous: when all three of us approve, it becomes Project canon automatically; when all three reject, it is Discarded. If the votes are split, it stays a proposal until everyone agrees. Discarded ideas are kept, never deleted, so nobody proposes them again by accident.</p>
  <div class="stats">${STATUSES.map(s=>`<div class="stat"><b class="${SCLASS[s]}">${count(s)}</b>${s}</div>`).join("")}</div>
  <h3 class="sub">Proposals to vote on</h3>${S.canWrite&&awaitingMyVote().length?`<p class="help"><b>${awaitingMyVote().length}</b> still need your vote.</p>`:""}
  ${!props.length?`<div class="empty">No proposals waiting.</div>`:`<div class="list">${props.map(e=>`<div class="row" style="cursor:default"><button class="btn ghost" style="padding:0;text-align:left;font-weight:700" data-open-entry="${e.id}">${esc(e.name)}</button>
    <span class="meta"><span class="chip type">${esc(e.type)}</span></span>
    ${e.summary?`<span class="sum">${esc(e.summary)}</span>`:""}<div style="grid-column:1/-1">${voteBox(e,true)}</div></div>`).join("")}</div>`}
  <h3 class="sub">Quests to vote on</h3>
  ${(()=>{const qs=[...S.quests.values()].filter(q=>qApproval(q)==="Proposal").sort(byName);return qs.length?`<div class="list">${qs.map(q=>`<div class="row" style="cursor:default"><button class="btn ghost" style="padding:0;text-align:left;font-weight:700" data-open-quest="${q.id}">${esc(q.name)}</button>
    <span class="meta">${q.plotId?`<span class="chip">${esc(plotName(q.plotId))}</span>`:""}</span>${q.pitch?`<span class="sum">${esc(q.pitch)}</span>`:""}<div style="grid-column:1/-1">${voteBox(q,true,"quest")}</div></div>`).join("")}</div>`:`<div class="empty">No quests waiting.</div>`})()}
  <h3 class="sub">Contradictions register</h3>
  <p class="help">Every time the team deliberately changes or fills in official Forgotten Realms canon, write it here: what changed, what canon says, and why.</p>
  ${reg.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>What we changed</th><th>Official canon says</th><th>Why</th><th>Decided by</th>${S.canWrite?"<th></th>":""}</tr></thead><tbody>
    ${reg.map(r=>`<tr><td style="font-family:var(--f-mono);white-space:nowrap">${esc(r.date)}</td><td>${esc(r.change)}</td><td>${esc(r.canonSays)}</td><td>${esc(r.why)}</td><td>${esc(r.decidedBy)}</td>${S.canWrite?`<td><button class="btn small danger" data-delreg="${r.id}">${S.confirmReg===r.id?"Confirm":"Remove"}</button></td>`:""}</tr>`).join("")}
  </tbody></table></div>`:`<div class="empty">No contradictions recorded yet.</div>`}
  ${S.canWrite?`<form id="regForm" class="form" style="margin-top:14px;max-width:720px">
    <div class="two"><label>What we changed<input type="text" id="r_change" required></label><label>Official canon says<input type="text" id="r_canon"></label></div>
    <div class="two"><label>Why<input type="text" id="r_why"></label><label>Decided by<input type="text" id="r_by" placeholder="Whole team"></label></div>
    <div><button class="btn primary" type="submit">Add to register</button></div></form>`:""}
  <h3 class="sub">Back up the bible</h3>
  <p class="help">Download everything (entries, plots and register) as one JSON file, to keep a copy or move it elsewhere.</p>
  <button class="btn" id="exportBtn">Download backup</button>`;
}

function viewHome(){

  </ul></div>`:""}
  <h3 class="sub">The sections</h3>
  <div class="hgrid">
    ${card("codex","Codex","The encyclopedia of the world. One entry per place, faction, character, god, event, item, people, or loose idea.",
      ["Search and filter by type, module or canon status.","Open an entry to read it, edit it, or follow its links to related entries.","Each entry has a public part (what everyone knows) and a secret part (what only the team knows).","Use type “Idea” for anything not yet sorted."],n(all.length,"entry","entries"))}
    ${card("timeline","Timeline","Every Event from the Codex, in year order, so the team agrees on what happened when.",
      ["Years are in DR (Dalereckoning). BG3 ends in 1492 DR.","Add an event with “New event”, or create a Codex entry of type Event with a year."],n(events,"event","events"))}
    ${card("canon","Canon","Where the team decides what is official.",
      ["New ideas start as <b>Proposal</b>. Each member votes Approve or Reject; only a unanimous vote makes it <b>Project canon</b> or <b>Discarded</b>.","<b>Official canon</b> means it comes from the games or D&amp;D books.","The contradictions register records each time we knowingly change official lore, and why.","Download a backup of the whole bible from the bottom of this page."],awaitingMyVote().length?n(awaitingMyVote().length,"awaits your vote","await your vote"):proposals?n(proposals,"open vote","open votes"):"Up to date")}
    ${card("cast","Factions & characters","Create the factions and characters of our story and connect them.",
      ["Guided creation: goal, means and base for factions; role, desire, fear and voice for characters.","Set leaders, members, allies and enemies.","“Use in a plot” puts a faction or character into an existing plot or starts a new one.","Each one is a Codex entry, voted on like any proposal."],`${factions().length} factions · ${characters().length} characters`)}

function refKey(n){return "ref-"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function inCodex(n){const k=refKey(n);return S.entries.has(k)?k:([...S.entries.values()].find(e=>(e.name||"").toLowerCase()===n.toLowerCase())||{}).id}
function refAction(p,kind){const id=inCodex(p.n);
  if(id)return `<button class="btn small" data-open-entry="${id}">In Codex</button>`;
  return S.canWrite?`<button class="btn small" data-addref="${esc(kind+":"+p.n)}">Add to Codex</button>`:"";}
async function addRefToCodex(key){
  const kind=key.slice(0,1),name=key.slice(2);const isF=kind==="F";
  const p=(isF?FACTIONS:NPCS).find(x=>x.n===name);if(!p)return;
  const id=refKey(p.n);
  const e={id,type:isF?"Faction":"NPC",name:p.n,module:isF?6:9,status:"Official canon",summary:p.r,source:p.g,
    changed:"At the end of BG3: "+p.f+" Our story takes place years later: decide what became of "+(isF?"this faction":"them")+".",
    public:"",secret:"",fields:isF?{}:{Role:p.r},links:[],tags:[]};
  if(await write("entries/"+id,stamp(e),"Added to the Codex")){S.entries.set(id,clean(e));renderView();}
}
const REF_GAMES=["BG1","Siege of Dragonspear","BG2","Throne of Bhaal","BG3"];
function refGames(p){return p.g.replace("BG1–BG3","BG1, BG2, BG3").replace("BG1–BG2","BG1, BG2")}
function refTable(list,kind,qid,gid,label){
  const q=(S[qid]||"").toLowerCase(),gf=S[gid]||"";
  const rows=list.filter(p=>(!q||(p.n+" "+p.r).toLowerCase().includes(q))&&(!gf||refGames(p).includes(gf)));
  return `<div class="bar"><input type="search" id="${qid}" placeholder="Search ${label}" value="${esc(S[qid]||"")}" aria-label="Search ${label}">
    <select id="${gid}" aria-label="Filter ${label} by game"><option value="">All games</option>${REF_GAMES.map(g=>`<option ${gf===g?"selected":""}>${g}</option>`).join("")}</select></div>
  ${rows.length?`<div class="tablewrap"><table><thead><tr><th>${kind==="F"?"Faction":"Character"}</th><th>Games</th><th>${kind==="F"?"What it is":"Who they are"}</th><th>At the end of BG3</th><th></th></tr></thead><tbody>
    ${rows.map(p=>`<tr><td><b>${esc(p.n)}</b></td><td style="white-space:nowrap">${esc(p.g)}</td><td>${esc(p.r)}</td><td>${esc(p.f)}</td><td>${refAction(p,kind)}</td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty">Nothing matches.</div>`}`;
}

  if(t.dataset.openQuest){S.qSessionForm=false;openDrawer({kind:"quest",id:t.dataset.openQuest});return}
  if(t.dataset.newquest){newQuest(t.dataset.newquest);return}
  if(t.dataset.useplot){openDrawer({kind:"useplot",id:t.dataset.useplot});return}
  if(t.dataset.vote){castVote(t.dataset.vote,t.dataset.v,t.dataset.voteKind||"entry");return}
  if(t.dataset.gotopin){gotoPin(t.dataset.gotopin);return}
  if(t.dataset.openEntry){if(S.entries.has(t.dataset.openEntry))openDrawer({kind:"entry",id:t.dataset.openEntry});}
  else if(t.dataset.openPlot)openDrawer({kind:"plot",id:t.dataset.openPlot});
  else if(t.dataset.tick)tick(t.dataset.tick,+t.dataset.d,"");
  else if(t.dataset.setstatus)setStatus(t.dataset.setstatus,t.dataset.s);
  else if(t.dataset.delreg)delReg(t.dataset.delreg);
  else if(t.dataset.portent)togglePortent(t.dataset.portent,+t.dataset.i,t.checked);
});

function openDrawer(sel,mode="view"){S.sel=sel;S.mode=mode;S.confirmDel=false;
  if(mode==="edit"&&sel.kind==="entry")S.draft=structuredClone(S.entries.get(sel.id)||sel.draft);
  if(mode==="edit"&&sel.kind==="plot")S.draft=structuredClone(S.plots.get(sel.id)||sel.draft);
  if(mode==="edit"&&sel.kind==="pin")S.draft=structuredClone(S.pins.get(sel.id)||sel.draft);
  if(mode==="edit"&&sel.kind==="quest")S.draft=structuredClone(S.quests.get(sel.id)||sel.draft);
  if(mode==="edit"&&sel.kind==="map")S.draft=structuredClone(S.maps.get(sel.id)||sel.draft);
  renderDrawer();renderView();}
function closeDrawer(){S.sel=null;S.draft=null;renderDrawer();renderView()}
function renderDrawer(){
  const d=$("#drawer"),lay=$("#layout");
  if(!S.sel){d.hidden=true;lay.classList.remove("open");return}
  d.hidden=false;lay.classList.add("open");
  const k=S.sel.kind;
  if(k==="entry")d.innerHTML=S.mode==="edit"?entryForm():entryView();
  else if(k==="plot")d.innerHTML=S.mode==="edit"?plotForm():plotView();
  else if(k==="pin")d.innerHTML=S.mode==="edit"?pinForm():pinView();
  else if(k==="map")d.innerHTML=mapForm();
  else if(k==="useplot")d.innerHTML=usePlotView();
  else if(k==="quest")d.innerHTML=S.mode==="edit"?questForm():questView();
  else d.innerHTML=turnForm();
  bindDrawer();
}

const PIN_COLORS={Location:"var(--accent)",Faction:"var(--official)",NPC:"var(--project)",Event:"var(--proposal)",Deity:"#8a5cc2",Item:"#c25c7a",People:"#3a9aa6",Idea:"var(--discarded)"};
S.mvs={};S.mapUrls={};S.addMode=false;S.moveId=null;S.pinType="";
function mapsSorted(){return [...S.maps.values()].sort((a,b)=>(a.order??0)-(b.order??0)||byName(a,b))}
function currentMap(){if(!S.mapId||!S.maps.has(S.mapId))S.mapId=(mapsSorted()[0]||{}).id||null;return S.maps.get(S.mapId)}
function pinEntry(p){return p.entryId?S.entries.get(p.entryId):null}
function pinLabel(p){const e=pinEntry(p);return p.label||(e&&e.name)||"Unnamed pin"}
async function mapUrl(m){
  if(!m||!m.image)return null;const c=S.mapUrls[m.image];
  if(c&&c.exp>Date.now())return c.url;
  if(c&&c.pending)return null;
  S.mapUrls[m.image]={pending:true,exp:0};
  const {data,error}=await S.sb.storage.from("maps").createSignedUrl(m.image,3600);
  if(error){S.mapUrls[m.image]={exp:0};toast("Couldn't load the map image: "+error.message);return null}
  S.mapUrls[m.image]={url:data.signedUrl,exp:Date.now()+50*60*1000};
  if(S.view==="map")renderView();return data.signedUrl;
}
function cachedUrl(m){const c=m&&m.image&&S.mapUrls[m.image];return c&&c.exp>Date.now()?c.url:null}
function mv(){const m=currentMap();if(!m)return null;return S.mvs[m.id]||(S.mvs[m.id]={z:0,x:0,y:0,fit:true})}
function applyMV(){
  const m=currentMap(),inner=$("#mapinner"),vp=$("#mapvp");if(!m||!inner||!vp)return;
  const v=mv();if(v.fit||!v.z)fitMap(false);
  inner.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;inner.style.setProperty("--inv",String(1/v.z));
}
function fitMap(apply=true){
  const m=currentMap(),vp=$("#mapvp");if(!m||!vp)return;const v=mv();
  const W=vp.clientWidth,H=vp.clientHeight;const z=Math.min(W/m.width,H/m.height);
  v.z=z;v.x=(W-m.width*z)/2;v.y=(H-m.height*z)/2;v.fit=false;if(apply)applyMV();
}
function zoomAt(f,cx,cy){
  const v=mv(),vp=$("#mapvp");if(!v||!vp)return;if(cx==null){cx=vp.clientWidth/2;cy=vp.clientHeight/2}
  const m=currentMap();const minZ=Math.min(vp.clientWidth/m.width,vp.clientHeight/m.height)*0.5;
  const nz=Math.max(minZ,Math.min(8,v.z*f));v.x=cx-(cx-v.x)*(nz/v.z);v.y=cy-(cy-v.y)*(nz/v.z);v.z=nz;applyMV();
}
function centerOn(p){const m=currentMap(),vp=$("#mapvp");if(!m||!vp)return;const v=mv();
  if(v.z<1)v.z=Math.min(1.2,8);v.x=vp.clientWidth/2-p.x*m.width*v.z;v.y=vp.clientHeight/2-p.y*m.height*v.z;v.fit=false;applyMV();}
function bindMap(){
  const v=$("#view");

async function saveMap(){

      ${al.length?`<dt>Allies</dt><dd>${chipsFor(al)}</dd>`:""}${en.length?`<dt>Enemies</dt><dd>${chipsFor(en)}</dd>`:""}</dl></div>`;

function plotFilter(p){

  if(S.pState==="resolved"&&st!=="Resolved")return false;

}
function relatedOut(p){return (p.related||[]).filter(r=>S.plots.has(r.id))}
function relatedIn(p){const out=[];S.plots.forEach(q=>{(q.related||[]).forEach(r=>{if(r.id===p.id)out.push({id:q.id,rel:r.rel})})});return out}

function buildGraph(){
  const plots=[...S.plots.values()].filter(plotFilter);const ids=new Set(plots.map(p=>p.id));
  const nodes=new Map(),edges=[];
  plots.forEach(p=>nodes.set("P:"+p.id,{key:"P:"+p.id,kind:"plot",ref:p}));
  if(S.mmEntries)plots.forEach(p=>(p.entries||[]).forEach(eid=>{const e=S.entries.get(eid);if(!e)return;
    if(!nodes.has("E:"+eid))nodes.set("E:"+eid,{key:"E:"+eid,kind:"entry",ref:e});edges.push({a:"P:"+p.id,b:"E:"+eid,type:"inv"})}));

  plots.forEach(p=>relatedOut(p).forEach(r=>{if(ids.has(r.id))edges.push({a:"P:"+p.id,b:"P:"+r.id,type:"rel",rel:r.rel})}));

}
const MM_PW=220,MM_PH=58;
function mmKey(k){return (S.mmEntries?"E":"P")+(S.mmQuests?"Q":"")+"|"+k}
function layoutGraph(g){

  if(pos.every(p=>p.fixed))return pos;
  for(let it=0;it<320;it++){
    const t=1-it/320,f=N.map(()=>({x:0,y:0}));
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      let dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
      const big=(N[i].kind==="plot"?1:0)+(N[j].kind==="plot"?1:0);
      const rep=(big===2?160000:big===1?50000:14000)/d2;f[i].x+=dx/d*rep;f[i].y+=dy/d*rep;f[j].x-=dx/d*rep;f[j].y-=dy/d*rep;

      const dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y,d=Math.hypot(dx,dy)||1,k=(d-L)*.04;
      f[i].x+=dx/d*k;f[i].y+=dy/d*k;f[j].x-=dx/d*k;f[j].y-=dy/d*k;});
    N.forEach((n,i)=>{f[i].x-=pos[i].x*.004;f[i].y-=pos[i].y*.006;
      if(pos[i].fixed)return;const m=Math.min(30,Math.hypot(f[i].x,f[i].y))*t;const h=Math.hypot(f[i].x,f[i].y)||1;
      pos[i].x+=f[i].x/h*m;pos[i].y+=f[i].y/h*m;});
  }

  const half=n=>n.kind==="plot"?{w:MM_PW/2+18,h:MM_PH/2+16}:n.kind==="quest"?{w:86,h:20}:{w:70,h:26};

      const ox=a.w+b.w-Math.abs(dx),oy=a.h+b.h-Math.abs(dy);if(ox<=0||oy<=0)continue;moved=true;

      if(ox<oy){const s=(dx>=0?1:-1)*(ox+1);pos[i].x-=s*wi;pos[j].x+=s*wj}else{const s=(dy>=0?1:-1)*(oy+1);pos[i].y-=s*wi;pos[j].y+=s*wj}}

  return pos;
}

function bindMindMap(){
  const wrap=$("#mmwrap"),svg=$("#mmsvg"),G=$("#mmg");if(!wrap)return;

      if(e.type==="quest"){eG.append(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"var(--accent)","stroke-width":1.5,"stroke-dasharray":"4 4",opacity:faded?.25:.8}));return}
      const s=boxEdge(e.a,b.x,b.y),t=boxEdge(e.b,a.x,a.y);
      eG.append(el("line",{x1:s.x,y1:s.y,x2:t.x,y2:t.y,stroke:"var(--accent)","stroke-width":2.5,"marker-end":"url(#mmarrow)",opacity:faded?.25:1}));
      const mx=(s.x+t.x)/2,my=(s.y+t.y)/2;const tx=el("text",{x:mx,y:my+4,"text-anchor":"middle",class:"mmrel",opacity:faded?.3:1});tx.textContent=e.rel;lG.append(tx);});

      if(n.kind==="plot"){const pl=n.ref,c=KIND_COLORS[pl.kind]||"var(--accent)",res=(pl.state||"Active")==="Resolved";

  }
  function applyView(){const v=S.mmView;if(v)G.setAttribute("transform",`translate(${v.x} ${v.y}) scale(${v.k})`)}
  function fit(){const xs=[...P.values()].map(p=>p.x),ys=[...P.values()].map(p=>p.y);
    const minx=Math.min(...xs)-PW/2-20,maxx=Math.max(...xs)+PW/2+20,miny=Math.min(...ys)-PH/2-30,maxy=Math.max(...ys)+PH/2+30;
    const W=wrap.clientWidth,H=wrap.clientHeight;const k=Math.min(1.4,Math.min(W/(maxx-minx),H/(maxy-miny)));
    S.mmView={k,x:W/2-(minx+maxx)/2*k,y:H/2-(miny+maxy)/2*k};applyView()}
  if(!S.mmView)fit();
  draw();
  const toWorld=(cx,cy)=>{const r=svg.getBoundingClientRect(),v=S.mmView;return {x:(cx-r.left-v.x)/v.k,y:(cy-r.top-v.y)/v.k}};
  let drag=null;
  svg.addEventListener("pointerdown",e=>{const nodeEl=e.target.closest(".mmnode");const w=toWorld(e.clientX,e.clientY);
    drag={key:nodeEl?nodeEl.dataset.key:null,sx:e.clientX,sy:e.clientY,moved:false,vx:S.mmView.x,vy:S.mmView.y,ox:nodeEl?P.get(nodeEl.dataset.key).x-w.x:0,oy:nodeEl?P.get(nodeEl.dataset.key).y-w.y:0};
    svg.setPointerCapture(e.pointerId)});
  svg.addEventListener("pointermove",e=>{if(!drag)return;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;if(!drag.moved)return;
    if(drag.key){const w=toWorld(e.clientX,e.clientY);const p=P.get(drag.key);p.x=w.x+drag.ox;p.y=w.y+drag.oy;draw();wrap.classList.add("dragging")}
    else{S.mmView.x=drag.vx+(e.clientX-drag.sx);S.mmView.y=drag.vy+(e.clientY-drag.sy);applyView();wrap.classList.add("dragging")}});
  svg.addEventListener("pointerup",()=>{if(!drag)return;const d=drag;drag=null;wrap.classList.remove("dragging");
    if(d.moved){if(d.key){const p=P.get(d.key);S.mmPos[mmKey(d.key)]={x:Math.round(p.x),y:Math.round(p.y)};saveMMPos()}return}
    if(!d.key){if(S.mmFocus){S.mmFocus=null;draw()}return}
    if(S.mmFocus===d.key){const [t,id]=d.key.split(":");openDrawer(t==="P"?{kind:"plot",id}:t==="Q"?{kind:"quest",id}:{kind:"entry",id});return}
    S.mmFocus=d.key;draw();});
  svg.addEventListener("keydown",e=>{const n=e.target.closest&&e.target.closest(".mmnode");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const [t,id]=n.dataset.key.split(":");openDrawer(t==="P"?{kind:"plot",id}:t==="Q"?{kind:"quest",id}:{kind:"entry",id})}});
  svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect(),v=S.mmView,f=e.deltaY<0?1.12:1/1.12,nk=Math.max(.2,Math.min(3,v.k*f));
    const cx=e.clientX-r.left,cy=e.clientY-r.top;v.x=cx-(cx-v.x)*(nk/v.k);v.y=cy-(cy-v.y)*(nk/v.k);v.k=nk;applyView()},{passive:false});
  wrap.querySelectorAll("[data-mmzoom]").forEach(b=>b.onclick=()=>{const v=S.mmView,f=+b.dataset.mmzoom,nk=Math.max(.2,Math.min(3,v.k*f)),cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;v.x=cx-(cx-v.x)*(nk/v.k);v.y=cy-(cy-v.y)*(nk/v.k);v.k=nk;applyView()});
  $("#mmFit").onclick=fit;
  $("#mmRelayout").onclick=()=>{g.nodes.forEach(n=>delete S.mmPos[mmKey(n.key)]);saveMMPos();S.mmView=null;S.mmFocus=null;renderView()};
}
function relatedSection(p){

/* ---------- quests ---------- */
const QUEST_STATUSES=["Planned","Open","In progress","Completed","Failed","Abandoned"];
const QUEST_DONE=["Completed","Failed","Abandoned"];
const QUEST_COLUMNS=[["Planned",["Planned"]],["Open to players",["Open"]],["In progress",["In progress"]],["Done",QUEST_DONE]];
const QCLASS={"Planned":"s-discarded","Open":"s-proposal","In progress":"s-official","Completed":"s-project","Failed":"s-failed","Abandoned":"s-discarded"};
S.qPlot="";S.qQ="";S.qSessionForm=false;
function qApproval(q){return q.approval||"Proposal"}
function qStatus(q){return q.status||"Planned"}
function qStatusChip(q){return `<span class="chip status ${QCLASS[qStatus(q)]||""}">${esc(qStatus(q))}</span>`}
function qApprovalChip(q){const a=qApproval(q);return a==="Proposal"?`<span class="chip status s-proposal">Awaiting the team's vote</span>`:a==="Discarded"?`<span class="chip status s-discarded">Rejected by vote</span>`:""}
function plotsSubnav(){const w=questsAwaitingMyVote().length;
  return `<nav class="subtabs" aria-label="Plots and quests"><a href="#plots" ${S.view==="plots"?'aria-current="page"':""}>Plots <span class="count">${S.plots.size}</span></a><a href="#quests" ${S.view==="quests"?'aria-current="page"':""}>Quests <span class="count">${S.quests.size}</span>${w?`<span class="count alert" title="${w} waiting for your vote">${w} to vote</span>`:""}</a></nav>`}
function questsOfPlot(pid){return [...S.quests.values()].filter(q=>q.plotId===pid||(q.alsoPlots||[]).includes(pid)).sort(byName)}
function questsOfEntry(eid){return [...S.quests.values()].filter(q=>q.giver===eid||q.location===eid||(q.entries||[]).includes(eid)).sort(byName)}
function questsAwaitingMyVote(){return [...S.quests.values()].filter(q=>qApproval(q)==="Proposal"&&!myVote(q.id,"quest"))}
function objProgress(q){const o=q.objectives||[];return o.length?`${o.filter(x=>x.done).length}/${o.length} objectives`:""}
function plotName(id){const p=S.plots.get(id);return p?p.name:"(deleted plot)"}
function effText(n){n=+n||0;return n===0?"no change":(n>0?`+${n} slice${n>1?"s":""}`:`${n} slice${n<-1?"s":""}`)}
function localToday(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function questChips(list){return list.map(q=>`<button class="chip" data-open-quest="${q.id}">${esc(q.name)} · ${esc(qStatus(q))}</button>`).join("")}
function questCard(q){
  const prog=objProgress(q);const last=(q.sessions||[]).slice(-1)[0];
  return `<button class="qcard" data-open-quest="${q.id}">
    <span class="qname">${esc(q.name||"Untitled quest")}</span>
    ${q.plotId?`<span class="note">Plot: ${esc(plotName(q.plotId))}</span>`:""}
    <span class="chips" style="margin:0">${qStatusChip(q)}${qApprovalChip(q)}</span>
    ${q.pitch?`<span class="qpitch">${esc(q.pitch)}</span>`:""}
    <span class="note">${[prog,q.giver&&S.entries.has(q.giver)?"Giver: "+esc(entryName(q.giver)):"",last?`Last session ${esc(last.date||"")}`:""].filter(Boolean).join(" · ")}</span>
  </button>`;
}
function viewQuests(){
  const q=(S.qQ||"").toLowerCase();
  const list=[...S.quests.values()].filter(x=>(!S.qPlot||x.plotId===S.qPlot||(x.alsoPlots||[]).includes(S.qPlot))
    &&(!q||[x.name,x.pitch,x.hook,plotName(x.plotId)].join(" ").toLowerCase().includes(q))).sort(byName);
  const plots=[...S.plots.values()].sort(byName);
  const waiting=questsAwaitingMyVote().length;
  return `<h2 class="view">Plots &amp; quests</h2>${plotsSubnav()}
  <p class="lede">Quests are what players actually do in a session. Each belongs to a plot, and its outcome moves that plot's clock. New quests are proposals: all three of you must approve one before it can open.</p>
  ${S.canWrite&&waiting?`<div class="attention"><b>${waiting} quest${waiting>1?"s":""} waiting for your vote.</b> Open ${waiting>1?"them":"it"} below (column “Planned”) or in Canon.</div>`:""}
  <div class="bar"><input type="search" id="qQ" placeholder="Search quests" value="${esc(S.qQ||"")}" aria-label="Search quests">
    <select id="qPlot" aria-label="Filter by plot"><option value="">All plots</option>${plots.map(p=>`<option value="${p.id}" ${S.qPlot===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    ${S.canWrite?`<button class="btn primary" id="newQuest">New quest</button>`:""}</div>
  ${!S.loaded.quests?`<div class="empty"><b>Loading quests…</b></div>`:!S.quests.size?`<div class="empty"><b>No quests yet</b>Click “New quest”, or open a plot and use “New quest for this plot”.</div>`:
  `<div class="qboard">${QUEST_COLUMNS.map(([title,sts])=>{const col=list.filter(x=>sts.includes(qStatus(x)));
    return `<section class="qcol"><h3>${title} <span class="note">${col.length}</span></h3>${col.map(questCard).join("")||`<p class="note">Nothing here.</p>`}</section>`}).join("")}</div>`}`;
}
function bindQuests(){
  const qq=$("#qQ");if(qq)qq.oninput=e=>{S.qQ=e.target.value;const pos=e.target.selectionStart;renderView();const n=$("#qQ");n.focus();n.setSelectionRange(pos,pos)};

function newQuest(plotId){S.qSessionForm=false;openDrawer({kind:"quest",id:null,draft:{id:uid(),name:"",plotId:plotId||"",alsoPlots:[],approval:"Proposal",status:"Planned",entries:[],objectives:[],sessions:[],effectSuccess:-1,effectFailure:1}},"edit")}
function questView(){

  const eff=st==="Completed"?(+q.effectSuccess||0):(+q.effectFailure||0);
  const to=p?Math.max(0,Math.min(p.clockSize|0,(p.clockFilled|0)+eff)):0;
  const sessions=(q.sessions||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let actions="";
  if(S.canWrite){
    if(ap!=="Approved")actions=`<p class="note">${ap==="Proposal"?"This quest can open once all three of you approve it.":"Rejected by the team. Edit it and send it back to the vote to try again."}</p>`;
    else{const b=(s,l,cls="")=>`<button class="btn small ${cls}" data-qstatus="${s}">${l}</button>`;
      actions=`<div class="actions" style="margin-top:6px">${st==="Planned"?b("Open","Open to players","primary"):""}${st==="Open"?b("In progress","Start","primary"):""}${st==="In progress"?b("Completed","Completed","primary")+b("Failed","Failed"):""}${!QUEST_DONE.includes(st)?b("Abandoned","Abandon"):b("In progress","Reopen")}</div>`;}
  }

  return `<div class="dhead"><div><h2>${esc(q.name)}</h2>${p?`<div class="fr">Quest of <button class="linkbtn" data-open-plot="${p.id}">${esc(p.name)}</button></div>`:""}</div>${closeBtn()}</div>
  <div class="chips">${qStatusChip(q)}${qApprovalChip(q)}${(q.alsoPlots||[]).filter(id=>S.plots.has(id)).map(id=>`<button class="chip" data-open-plot="${id}">Also: ${esc(plotName(id))}</button>`).join("")}</div>
  ${ap==="Proposal"?`<div class="sec"><h4>Team vote</h4>${voteBox(q,false,"quest")}</div>`:decisionLine(q)}
  ${actions}
  ${outcomePending?`<div class="outcome"><b>${st==="Completed"?"Quest completed":"Quest failed"}: apply the outcome to “${esc(p.name)}”?</b>
    <div>Clock: ${p.clockFilled|0}/${p.clockSize|0} → <b>${to}/${p.clockSize|0}</b> (${effText(eff)})${st==="Failed"&&q.failPortent?`, and the portent “${esc(q.failPortent)}” happens`:""}.</div>
    ${S.canWrite?`<div class="actions" style="margin-top:6px"><button class="btn small primary" data-qapply>Apply</button><button class="btn small" data-qskip>Skip</button></div>`:""}</div>`:""}
  ${q.outcome&&q.outcome.applied?`<p class="note">${q.outcome.skipped?"Outcome not applied to the plot.":`Outcome applied to the plot's clock on ${new Date(q.outcome.appliedAt||Date.now()).toLocaleDateString()}.`}</p>`:""}
  ${sec("Pitch",q.pitch)}${sec("Hook: how players hear about it",q.hook)}${sec("Unlocks when",q.prereq)}
  ${(q.giver&&S.entries.has(q.giver))||loc?`<div class="sec"><h4>Who and where</h4><dl class="rels">
    ${q.giver&&S.entries.has(q.giver)?`<dt>Quest giver</dt><dd>${chipsFor([q.giver])}</dd>`:""}
    ${loc?`<dt>Location</dt><dd>${chipsFor([loc.id])}${locPins.map(pp=>`<button class="chip" data-gotopin="${pp.id}">On ${esc((S.maps.get(pp.mapId)||{}).name||"map")}</button>`).join("")}</dd>`:""}</dl></div>`:""}
  ${(q.entries||[]).filter(id=>S.entries.has(id)).length?`<div class="sec"><h4>Factions and characters involved</h4><div class="links">${chipsFor((q.entries||[]).filter(id=>S.entries.has(id)))}</div></div>`:""}
  ${objs.length?`<div class="sec"><h4>Objectives (${objs.filter(o=>o.done).length}/${objs.length})</h4><ul class="portents">${objs.map((o,i)=>`<li class="${o.done?"done":""}"><input type="checkbox" ${o.done?"checked":""} ${S.canWrite?"":"disabled"} data-qobj="${i}" aria-label="Objective ${i+1} done"><span>${esc(o.text)}</span></li>`).join("")}</ul></div>`:""}

    <dt>If it fails</dt><dd style="display:block">${esc(q.failure||"")}${p?` <span class="note">(${esc(p.name)}: ${effText(q.effectFailure)}${q.failPortent?`; portent “${esc(q.failPortent)}”`:""})</span>`:""}</dd></dl></div>`:""}

}

      ${(p.portents||[]).length?`<label>Portent triggered on failure <span class="hint">Optional</span><select id="q_portent"><option value="">None</option>${p.portents.map(x=>`<option ${q.failPortent===x.text?"selected":""}>${esc(x.text)}</option>`).join("")}</select></label>`:""}`:`<p class="note" style="margin:0">Choose a plot to set the effect on its clock.</p>`}
      <p class="note" style="margin:0">Negative numbers erase slices (good for the heroes against a threat); positive numbers fill them.</p>
    </fieldset>

}
function readQuestForm(){
  const q=S.draft,g=id=>{const el=document.getElementById(id);return el?el.value:undefined};
  q.name=(g("q_name")||"").trim();q.pitch=g("q_pitch")||"";q.plotId=g("q_plot")||"";q.hook=g("q_hook")||"";q.prereq=(g("q_prereq")||"").trim();
  q.giver=g("q_giver")||"";q.location=g("q_location")||"";q.success=g("q_success")||"";q.failure=g("q_failure")||"";q.reward=g("q_reward")||"";
  if(g("q_effS")!==undefined)q.effectSuccess=+g("q_effS");if(g("q_effF")!==undefined)q.effectFailure=+g("q_effF");
  q.failPortent=g("q_portent")!==undefined?g("q_portent"):(q.plotId?q.failPortent||"":"");
  const old=q.objectives||[];q.objectives=(g("q_obj")||"").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({text:t,done:!!(old.find(o=>o.text===t)||{}).done}));
  q.alsoPlots=(q.alsoPlots||[]).filter(id=>id!==q.plotId);
  const rv=document.getElementById("q_revote");q._revote=!!(rv&&rv.checked);
}
async function writeQuest(q,ok){const body=clean(q);delete body._revote;if(await write("quests/"+q.id,stamp(body),ok)){S.quests.set(q.id,body);return true}return false}
async function saveQuest(){
  readQuestForm();const q=S.draft;if(!q.name){toast("Give the quest a name.");return}
  if(!S.quests.has(q.id)){q.approval="Proposal";q.status="Planned"}
  if(q._revote){q.approval="Proposal";q.status="Planned";delete q.outcome}
  if(await writeQuest(q,S.quests.has(q.id)?"Quest saved":"Quest proposed to the team")){S.sel={kind:"quest",id:q.id};S.mode="view";S.draft=null;renderDrawer();renderView()}
}
async function setQuestStatus(id,status){
  const q=S.quests.get(id);if(!q)return;const n=clean(q);n.status=status;

  if(await writeQuest(n,{"Open":"Open to players","In progress":"Quest started","Completed":"Quest completed","Failed":"Quest failed","Abandoned":"Quest abandoned"}[status]||"Saved")){renderDrawer();renderView()}
}
async function applyOutcome(id,skip){
  const q=S.quests.get(id);if(!q)return;const n=clean(q);
  if(!skip){const p=S.plots.get(q.plotId);if(!p)return;const st=qStatus(q);const eff=st==="Completed"?(+q.effectSuccess||0):(+q.effectFailure||0);
    const pn=clean(p);const from=pn.clockFilled|0,to=Math.max(0,Math.min(pn.clockSize|0,from+eff));pn.clockFilled=to;
    pn.history=[...(pn.history||[]),{at:Date.now(),from,to,note:`Quest “${q.name}” ${st==="Completed"?"completed":"failed"}`}].slice(-50);
    if(st==="Failed"&&q.failPortent)(pn.portents||[]).forEach(x=>{if(x.text===q.failPortent)x.done=true});
    if(!(await write("plots/"+p.id,stamp(pn))))return;S.plots.set(p.id,pn);
    if(to>=(pn.clockSize|0)&&from<to)toast(`${p.name}: the clock is full. It happens.`);}
  n.outcome={...(n.outcome||{}),applied:true,skipped:!!skip,appliedAt:Date.now()};
  if(await writeQuest(n,skip?"Outcome skipped":"Outcome applied to the plot")){renderDrawer();renderView()}
}

/* ---------- votes ---------- */
S.votes=new Map(); // entryId -> Map(voter -> "approve"|"reject")
S.qvotes=new Map();
const VOTE_CFG={entry:{table:"votes",col:"entry_id",store:"votes"},quest:{table:"quest_votes",col:"quest_id",store:"qvotes"}};
function votesFor(id,kind="entry"){return S[VOTE_CFG[kind].store].get(id)||new Map()}
function voteNeed(){return S.members.size||1}
function myVote(id,kind="entry"){return votesFor(id,kind).get(S.me)||""}
function awaitingMyVote(){return [...S.entries.values()].filter(e=>e.status==="Proposal"&&!myVote(e.id))}
function setVoteLocal(entryId,voter,vote,kind="entry"){const st=S[VOTE_CFG[kind].store];let m=st.get(entryId);if(!m){m=new Map();st.set(entryId,m)}if(vote)m.set(voter,vote);else m.delete(voter)}
const voteBusy=new Set();
async function castVote(entryId,vote,kind="entry"){
  const cfg=VOTE_CFG[kind];const key=kind+":"+entryId;
  if(voteBusy.has(key))return;voteBusy.add(key);
  const mine=myVote(entryId,kind);
  try{
    if(mine===vote){
      const {error}=await S.sb.from(cfg.table).delete().eq(cfg.col,entryId).eq("voter",S.me);if(error)throw error;
      setVoteLocal(entryId,S.me,"",kind);toast("Vote withdrawn");
    }else{
      const {error}=await S.sb.from(cfg.table).upsert({[cfg.col]:entryId,voter:S.me,vote});if(error)throw error;
      setVoteLocal(entryId,S.me,vote,kind);toast(vote==="approve"?"You voted to approve":"You voted to reject");
    }
  }catch(err){toast("Couldn't record the vote: "+(err.message||err))}
  finally{voteBusy.delete(key);renderView();if(S.sel&&S.sel.kind===kind&&S.sel.id===entryId&&S.mode==="view")renderDrawer()}
}
function voteBox(e,compact,kind="entry"){
  const v=votesFor(e.id,kind),need=voteNeed();
  const yes=[...v.values()].filter(x=>x==="approve").length,no=[...v.values()].filter(x=>x==="reject").length;
  const mine=myVote(e.id,kind);
  const people=[...S.members.keys()].sort().map(em=>{const x=v.get(em);
    return `<span class="voter ${x||"none"}" title="${esc(em)}: ${x==="approve"?"approves":x==="reject"?"rejects":"has not voted yet"}">${x==="approve"?"✓":x==="reject"?"✗":"·"} ${esc(em===S.me?"you":em.split("@")[0])}</span>`}).join("");
  return `<div class="votebox${compact?" compact":""}">
    <div class="votecount"><b>${yes}</b> approve · <b>${no}</b> reject <span class="note">· all ${need} must agree</span></div>
    ${yes&&no?`<p class="note" style="margin:0">The votes are split. It stays a proposal until everyone agrees: talk it over, rework the idea, or change your vote.</p>`:""}
    <div class="voters">${people}</div>
    ${S.canWrite?`<div class="votebtns"><button class="btn small${mine==="approve"?" voted-yes":""}" data-vote="${e.id}" data-vote-kind="${kind}" data-v="approve" aria-pressed="${mine==="approve"}">${mine==="approve"?"✓ Approved":"Approve"}</button><button class="btn small${mine==="reject"?" voted-no":""}" data-vote="${e.id}" data-vote-kind="${kind}" data-v="reject" aria-pressed="${mine==="reject"}">${mine==="reject"?"✗ Rejected":"Reject"}</button>${mine?`<span class="note">Click your vote again to withdraw it.</span>`:""}</div>`:""}
  </div>`;
}
function decisionLine(e){const d=e.decision;if(!d||!d.result)return "";
  return `<p class="note">${d.result==="approved"?"Approved":"Rejected"} by the team's vote, ${d.approve} for and ${d.reject} against${d.at?`, on ${new Date(d.at).toLocaleDateString()}`:""}.</p>`;}

function stamp(o){o.updatedAt=Date.now();if(S.me)o.updatedBy=S.me;return o}
function clean(o){return JSON.parse(JSON.stringify(o))}
async function write(path,data,ok){
  const [table,id]=path.split("/");
  const body=clean(data);delete body.id;delete body.updatedAt;delete body.updatedBy;
  const {error}=await S.sb.from(table).upsert({id,data:body,updated_at:new Date().toISOString(),updated_by:S.me});
  if(error){toast("Couldn't save: "+error.message);return false}
  if(ok)toast(ok);return true;
}
async function del(table,id){const {error}=await S.sb.from(table).delete().eq("id",id);if(error)throw error}
function newEntry(type="Idea"){openDrawer({kind:"entry",id:null,draft:{id:uid(),type,status:"Proposal",module:DEFAULT_MODULE[type],links:[],fields:{},tags:[]}},"edit")}
function newPlot(){openDrawer({kind:"plot",id:null,draft:{id:uid(),kind:"Front",state:"Active",origin:"New",clockSize:6,clockFilled:0,portents:[],entries:[],history:[]}},"edit")}

async function savePlot(){
  const p=S.draft;if(!p.name){toast("Give the plot a name first.");return}
  const prev=S.plots.get(p.id);
  if(prev&&(prev.clockFilled|0)!==(p.clockFilled|0))p.history=[...(p.history||[]),{at:Date.now(),from:prev.clockFilled|0,to:p.clockFilled|0,note:"Edited"}].slice(-50);
  const ok=await write("plots/"+p.id,stamp(p),"Saved");
  if(ok){S.plots.set(p.id,clean(p));S.sel={kind:"plot",id:p.id};S.mode="view";S.draft=null;renderDrawer();renderView()}

async function removeSelected(){
  const {kind,id}=S.sel;const path=({entry:"entries/",plot:"plots/",pin:"pins/",quest:"quests/"}[kind])+id;
  try{await del(path.split("/")[0],id);({entry:S.entries,plot:S.plots,pin:S.pins,quest:S.quests}[kind]).delete(id);toast("Deleted");closeDrawer()}catch(err){toast("Couldn't delete: "+(err.message||"error"))}
}
const busy=new Set();
async function tick(id,delta,note){
  const p=S.plots.get(id);if(!p||busy.has(id))return;
  const to=Math.max(0,Math.min(p.clockSize|0,(p.clockFilled|0)+delta));if(to===(p.clockFilled|0))return;
  const next=clean(p);next.history=[...(p.history||[]),{at:Date.now(),from:p.clockFilled|0,to,note:note||(delta>0?"Progress":"Setback")}].slice(-50);next.clockFilled=to;
  busy.add(id);const ok=await write("plots/"+id,stamp(next));busy.delete(id);
  if(ok){S.plots.set(id,next);if(to>=(p.clockSize|0))toast(`${p.name}: the clock is full. It happens.`);renderView();if(S.sel&&S.sel.id===id&&S.mode==="view")renderDrawer()}
}
async function togglePortent(id,i,done){
  const p=S.plots.get(id);if(!p)return;const next=clean(p);if(!next.portents[i])return;next.portents[i].done=done;
  if(await write("plots/"+id,stamp(next))){S.plots.set(id,next);renderView();if(S.sel&&S.sel.id===id&&S.mode==="view")renderDrawer()}
}

const TABLES={entries:S.entries,plots:S.plots,register:S.register,maps:S.maps,pins:S.pins,quests:S.quests};
function rowToItem(r){return {...(r.data||{}),id:r.id,updatedAt:r.updated_at?Date.parse(r.updated_at):null,updatedBy:r.updated_by}}
async function loadAll(){
  for(const [t,map] of Object.entries(TABLES)){
    const {data,error}=await S.sb.from(t).select("*");
    S.loaded[t]=true;
    if(error){$("#banner").innerHTML=`<div class="banner">Couldn't load the bible: ${esc(error.message)}. Reload the page to try again.</div>`;continue}
    map.clear();data.forEach(r=>map.set(r.id,rowToItem(r)));
  }
  const {data:ms}=await S.sb.from("members").select("*");
  S.members.clear();(ms||[]).forEach(m=>S.members.set(m.email,m));
  const {data:qvs}=await S.sb.from("quest_votes").select("*");
  S.qvotes.clear();(qvs||[]).forEach(x=>setVoteLocal(x.quest_id,x.voter,x.vote,"quest"));
  const {data:vs}=await S.sb.from("votes").select("*");
  S.votes.clear();(vs||[]).forEach(x=>setVoteLocal(x.entry_id,x.voter,x.vote));
  renderView();if(S.sel&&S.mode==="view")renderDrawer();
}
function listen(){
  S.sb.channel("bible").on("postgres_changes",{event:"*",schema:"public"},p=>{
    if(p.table==="quest_votes"){if(p.eventType==="DELETE")setVoteLocal(p.old.quest_id,p.old.voter,"","quest");else setVoteLocal(p.new.quest_id,p.new.voter,p.new.vote,"quest")}
    else if(p.table==="votes"){if(p.eventType==="DELETE")setVoteLocal(p.old.entry_id,p.old.voter,"");else setVoteLocal(p.new.entry_id,p.new.voter,p.new.vote)}
    else if(p.table==="members"){if(p.eventType==="DELETE")S.members.delete(p.old.email);else S.members.set(p.new.email,p.new)}
    else{const map=TABLES[p.table];if(!map)return;
      if(p.eventType==="DELETE")map.delete(p.old.id);else map.set(p.new.id,rowToItem(p.new));}
    renderView();if(S.sel&&S.mode==="view")renderDrawer();
  }).subscribe();
}

let firstTime=false;
function setMode(ft){firstTime=ft;$("#firstTimeFields").hidden=!ft;$("#loginPassword2").required=ft;$("#loginCode").required=ft;
  $("#loginPassword").autocomplete=ft?"new-password":"current-password";
  $("#loginBtn").textContent=ft?"Create my password and sign in":"Sign in";
  $("#modeBtn").textContent=ft?"Already have a password? Sign in":"First time here? Create your password";
  $("#loginIntro").textContent=ft?"Choose a password (8 characters or more) and enter the invite code a teammate sent you.":"The team's worldbuilding codex. Only people on the team list can sign in.";
  $("#loginMsg").textContent="";}
$("#modeBtn").addEventListener("click",()=>setMode(!firstTime));
$("#loginForm").addEventListener("submit",async ev=>{
  ev.preventDefault();const email=$("#loginEmail").value.trim().toLowerCase(),pw=$("#loginPassword").value;const btn=$("#loginBtn"),msg=$("#loginMsg");
  btn.disabled=true;msg.textContent="Checking…";const done=t=>{btn.disabled=false;msg.textContent=t};
  if(firstTime){
    if(pw!==$("#loginPassword2").value)return done("The two passwords are different.");
    const {data:ok,error:e1}=await S.sb.rpc("can_sign_in",{p_email:email});
    if(e1)return done("Couldn't reach the database: "+e1.message);
    if(!ok)return done("This email isn't on the team list. Ask a teammate to add you on the Team page.");
    S.pendingCode=$("#loginCode").value.trim().toUpperCase();
    const {data,error}=await S.sb.auth.signUp({email,password:pw});
    if(error)return done(/registered|exists/i.test(error.message)?"This email already has a password. Use “Sign in” instead.":"Couldn't create the password: "+error.message);
    if(!data.session)return done("Account created, but Supabase still asks for email confirmation. The admin needs to turn off “Confirm email” in Supabase.");
    btn.disabled=false;showApp(data.session);
  }else{
    const {data,error}=await S.sb.auth.signInWithPassword({email,password:pw});
    if(error)return done(/invalid/i.test(error.message)?"Wrong email or password. First time here? Use “Create your password” below.":"Couldn't sign in: "+error.message);
    btn.disabled=false;showApp(data.session);
  }
});
$("#signOut").addEventListener("click",async()=>{await S.sb.auth.signOut();location.hash="";location.reload()});

(async()=>{
  if(!window.supabase){document.body.innerHTML="<p style='padding:24px'>The app couldn't load. Check your internet connection and reload.</p>";return}
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await S.sb.auth.getSession();
  if(session)showApp(session);else showLogin();
  S.sb.auth.onAuthStateChange((evt,sess)=>{if(evt==="SIGNED_OUT")showLogin()});
})();
</script>
</body>
